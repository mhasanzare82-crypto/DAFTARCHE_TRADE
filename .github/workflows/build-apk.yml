name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Print build environment
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            flutter pub get && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Dependency resolution failed; retrying in 20 seconds (attempt $attempt/3)."
            sleep 20
          done

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run DOCX import regression tests
        run: flutter test test/services/docx_import_service_test.dart
      - name: Build release APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --verbose && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Release build failed; retrying in 30 seconds (attempt $attempt/3)."
            sleep 30
          done

      - name: Verify APK output
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notebook-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
